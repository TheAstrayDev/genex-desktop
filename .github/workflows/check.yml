name: Native background acceptance
on: workflow_dispatch
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c074736fc6eda94f5f59ae57c52ce2351d0b3e58
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git rev-parse HEAD
      - run: npm run typecheck
      - run: npm run verify:architecture
      - run: npm run verify:context
      - run: node scripts/affected-tests.mjs --base 7110aad9 --lint
      - name: Native lifecycle, real Seatbelt workers and affected host contracts
        run: |
          mkdir -p .studio-dev/evidence
          node scripts/test.mjs tests/conformance/native-background.test.ts tests/conformance/native-job-supervisor.test.ts tests/conformance/native-jobs-ipc.test.ts tests/conformance/plugin-native.test.ts tests/conformance/native-sandbox.test.ts tests/conformance/plugin-sdk-types.test.ts tests/conformance/plugin-install-words.test.ts tests/conformance/plugin-native-action.test.ts tests/conformance/ipc-contract.test.ts tests/conformance/native-policy.test.ts tests/conformance/core-surface.test.ts tests/conformance/plugin-lifecycle.test.ts tests/conformance/plugins.test.ts | tee .studio-dev/evidence/native-mac.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-mac
          path: .studio-dev/evidence/native-mac.txt
          include-hidden-files: true
